<text x="20" y="95" fill="#c9d1d9" font-size="14px">
<tspan x="20" y="95" class="cc">. </tspan><tspan class="key">status</tspan>:<tspan class="cc"> .............................. </tspan><tspan class="value">open to work · razorpay buildathon '26</tspan>
<tspan x="20" y="115" class="cc">. </tspan><tspan class="key">stack</tspan>:<tspan class="cc"> ...... </tspan><tspan class="value">Python · C · TypeScript · Rust · Linux</tspan>
<tspan x="20" y="135" class="cc">. </tspan><tspan class="key">interests</tspan>:<tspan class="cc"> .................... </tspan><tspan class="value">ai agents · security · evals · inference</tspan>
<tspan x="20" y="155" class="cc">. </tspan><tspan class="key">focus</tspan>:<tspan class="cc"> ................ </tspan><tspan class="value">harnesses that hold models accountable</tspan>
<tspan x="20" y="175" class="cc">. </tspan><tspan class="key">roots</tspan>:<tspan class="cc"> ........................... </tspan><tspan class="value">heartbleed → cves → 0days → ai</tspan>
</text>
<line x1="20" y1="195" x2="660" y2="195" stroke="#21262d" stroke-width="1"/>
<text x="20" y="220" fill="#c9d1d9" font-size="14px">
<tspan x="20" y="220" class="cc">. </tspan><tspan class="key">repos</tspan>:<tspan class="cc" id="repo_data_dots"> ......... </tspan><tspan class="value" id="repo_data">--</tspan> <tspan class="cc">|</tspan> <tspan class="key">stars</tspan>:<tspan class="cc" id="star_data_dots"> ................. </tspan><tspan class="value" id="star_data">--</tspan>
<tspan x="20" y="240" class="cc">. </tspan><tspan class="key">commits</tspan>:<tspan class="cc" id="commit_data_dots"> ...... </tspan><tspan class="value" id="commit_data">--</tspan> <tspan class="cc">|</tspan> <tspan class="key">followers</tspan>:<tspan class="cc" id="follower_data_dots"> ............. </tspan><tspan class="value" id="follower_data">--</tspan>
<tspan x="20" y="260" class="cc">. </tspan><tspan class="key">lines of code</tspan>:<tspan class="cc" id="loc_data_dots"> </tspan><tspan class="value" id="loc_data">--</tspan> <tspan class="cc">(</tspan><tspan class="addColor" id="loc_add">--</tspan><tspan class="addColor">++</tspan><tspan class="cc">,</tspan> <tspan class="delColor" id="loc_del">--</tspan><tspan class="delColor">--</tspan><tspan class="cc">)</tspan>
