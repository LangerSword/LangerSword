name: Generate Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: LangerSword
          BRANCH_NAME: main
          UTC_OFFSET: 5
          COMMIT_MESSAGE: "chore: update profile cards [skip ci]"
          COMMITTER: langersword <lakshayasharma695@gmail.com>
          THEME_NAME: tokyonight
          EXCLUDE_LANG: ""
          COMMIT_ONLY_ON_UPDATES: true
          COMMIT_ON_CHANGES: true
          COMMIT_ON_NEW_DAY: true
