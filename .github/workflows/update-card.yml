name: Update Profile Card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch stats and update card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USER="LangerSword"
          
          # Get user data
          USER_DATA=$(curl -s "https://api.github.com/users/$USER")
          REPOS=$(echo "$USER_DATA" | python3 -c "import sys,json; print(json.load(sys.stdin)['public_repos'])")
          FOLLOWERS=$(echo "$USER_DATA" | python3 -c "import sys,json; print(json.load(sys.stdin)['followers'])")
          
          # Get total stars
          STARS=$(curl -s "https://api.github.com/users/$USER/repos?per_page=100" | python3 -c "import sys,json; repos=json.load(sys.stdin); print(sum(r.get('stargazers_count',0) for r in repos))")
          
          # Get total commits (approximate from events)
          COMMITS=$(curl -s "https://api.github.com/users/$USER/events?per_page=100" | python3 -c "import sys,json; events=json.load(sys.stdin); print(sum(1 for e in events if e.get('type')=='PushEvent'))")
          
          # For LOC, we'll use a rough estimate from repos
          echo "repos=$REPOS stars=$STARS commits=$COMMITS followers=$FOLLOWERS"
          
          # Update SVG with sed (simple text replacement)
          sed -i "s/id=\"repo_data\">--/id=\"repo_data\">$REPOS/" profile-card.svg
          sed -i "s/id=\"star_data\">--/id=\"star_data\">$STARS/" profile-card.svg
          sed -i "s/id=\"commit_data\">--/id=\"commit_data\">$COMMITS/" profile-card.svg
          sed -i "s/id=\"follower_data\">--/id=\"follower_data\">$FOLLOWERS/" profile-card.svg
          sed -i "s/id=\"loc_data\">--/id=\"loc_data\">N\/A/" profile-card.svg
          sed -i "s/id=\"loc_add\">--/id=\"loc_add\">N\/A/" profile-card.svg
          sed -i "s/id=\"loc_del\">--/id=\"loc_del\">N\/A/" profile-card.svg
          
          # Update dots (simplified)
          sed -i 's/id="repo_data_dots">[^<]*/id="repo_data_dots"> /' profile-card.svg
          sed -i 's/id="star_data_dots">[^<]*/id="star_data_dots"> /' profile-card.svg
          sed -i 's/id="commit_data_dots">[^<]*/id="commit_data_dots"> /' profile-card.svg
          sed -i 's/id="follower_data_dots">[^<]*/id="follower_data_dots"> /' profile-card.svg
          sed -i 's/id="loc_data_dots">[^<]*/id="loc_data_dots"> /' profile-card.svg

      - name: Commit changes
        run: |
          git add profile-card.svg
          git diff --cached --quiet && echo "No changes" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update profile card stats"
          git push